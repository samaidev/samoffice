# 课程式混合配置：mix.py 按此文件采样并按 order 升序输出（课程学习顺序）
# ratio 为该阶段在最终训练集中的目标占比（按字符数近似 token 配比）

stages:
  - name: stage0_language_basics
    order: 0
    ratio: 0.03
    dirs: [data/stage0]
  - name: stage1_primary
    order: 1
    ratio: 0.12
    dirs: [data/stage1]
  - name: stage2_junior
    order: 2
    ratio: 0.20
    dirs: [data/stage2]
  - name: stage3_senior
    order: 3
    ratio: 0.25
    dirs: [data/stage3]
  - name: stage4_university
    order: 4
    ratio: 0.10
    dirs: [data/stage4]
  - name: general
    order: 9          # order=9 表示均匀穿插到所有阶段中，而不是排在最后
    interleave: true
    ratio: 0.30
    dirs: [data/general]

output:
  shuffle_within_stage: true
  seed: 42
