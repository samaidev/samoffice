name: Release

# 推送 v* 标签（或手动触发）时构建三平台桌面产物并发布 GitHub Release：
#   Windows: Inno Setup 安装包 + 便携 zip
#   macOS:   SamOffice.app（AppIcon.icns + Info.plist + ad-hoc 签名）→ zip / dmg，arm64 + x64
#   Linux:   samoffice + samoffice.desktop + 图标 → tar.gz 便携包
# 各平台 job 上传 artifact，release job 汇总上传，最后清理只保留最近 3 个 release。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 0.5.1，不带 v 前缀）'
        required: true
        default: '0.5.0'

permissions:
  contents: write

jobs:
  windows:
    name: Windows (amd64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $v = "${{ github.event.inputs.version }}".TrimStart('v')
          } else {
            $v = "${{ github.ref_name }}".TrimStart('v')
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Version: $v"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: go.sum

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        shell: pwsh
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Build desktop exe (windows/amd64)
        shell: pwsh
        env:
          CGO_ENABLED: '0'
          GOOS: windows
          GOARCH: amd64
        run: |
          go build -tags desktop,production -trimpath -ldflags "-s -w -H windowsgui" -o samoffice.exe .
          Get-Item samoffice.exe | Select-Object Name, Length

      - name: Locate Inno Setup (ISCC)
        id: iscc
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 7\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            Write-Host "ISCC not found, installing via Chocolatey..."
            choco install innosetup -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          "path=$iscc" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "ISCC: $iscc"

      - name: Resolve Chinese language file
        id: cnisl
        shell: pwsh
        run: |
          $innoDir = Split-Path "${{ steps.iscc.outputs.path }}"
          $found = Get-ChildItem -Path $innoDir -Recurse -Filter "ChineseSimplified.isl" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($found) {
            $cn = $found.FullName
            Write-Host "Found bundled Chinese ISL: $cn"
          } else {
            $cn = Join-Path $env:RUNNER_TEMP "ChineseSimplified.isl"
            # 优先 6.4.1（与 runner 的 Inno Setup 6 匹配），失败则回退 7.1.1 官方中文
            $urls = @(
              "https://raw.githubusercontent.com/jrsoftware/issrc/is-6_4_1/Files/Languages/Unofficial/ChineseSimplified.isl",
              "https://raw.githubusercontent.com/jrsoftware/issrc/is-7_1_1/Files/Languages/ChineseSimplified.isl"
            )
            $ok = $false
            foreach ($u in $urls) {
              try { Invoke-WebRequest -Uri $u -OutFile $cn; $ok = $true; Write-Host "Downloaded Chinese ISL: $u"; break } catch { Write-Host "miss: $u" }
            }
            if (-not $ok) { throw "Cannot obtain ChineseSimplified.isl" }
          }
          "path=$cn" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          & "${{ steps.iscc.outputs.path }}" /DMyAppVersion=${{ steps.ver.outputs.version }} "/DCnMessages=${{ steps.cnisl.outputs.path }}" /Q packaging/windows/SamOffice.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }
          Get-ChildItem packaging/windows/dist | Select-Object Name, Length

      - name: Build portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path stage/SamOffice-windows-x64 | Out-Null
          Copy-Item samoffice.exe stage/SamOffice-windows-x64/
          Copy-Item README.md stage/SamOffice-windows-x64/
          Compress-Archive -Path stage/SamOffice-windows-x64 -DestinationPath "SamOffice-desktop-windows-x64-${{ steps.ver.outputs.version }}.zip" -Force
          Get-Item "SamOffice-desktop-windows-x64-${{ steps.ver.outputs.version }}.zip" | Select-Object Name, Length

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            packaging/windows/dist/SamOffice-setup-${{ steps.ver.outputs.version }}.exe
            SamOffice-desktop-windows-x64-${{ steps.ver.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-14 已于 2026-11-02 退役；x64 只能用 macos-15-intel
          - arch: arm64
            os: macos-15
          - arch: x64
            os: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            v="${{ github.event.inputs.version }}"
          else
            v="${{ github.ref_name }}"
          fi
          v="${v#v}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Version: $v"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: go.sum

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Build SamOffice.app (zip + dmg)
        env:
          ARCH: ${{ matrix.arch }}
          SKIP_FRONTEND: '1'
        run: ./packaging/macos/build_macos_app.sh "${{ steps.ver.outputs.version }}" dist-macos

      - name: Verify bundle
        run: |
          test -x dist-macos/SamOffice.app/Contents/MacOS/samoffice
          test -f dist-macos/SamOffice.app/Contents/Resources/AppIcon.icns
          plutil -lint dist-macos/SamOffice.app/Contents/Info.plist
          codesign --verify --deep dist-macos/SamOffice.app
          ls -lh dist-macos

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-${{ matrix.arch }}
          path: dist-macos/SamOffice-macos-${{ matrix.arch }}-${{ steps.ver.outputs.version }}.*
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Linux (amd64)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            v="${{ github.event.inputs.version }}"
          else
            v="${{ github.ref_name }}"
          fi
          v="${v#v}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Version: $v"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: go.sum

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install desktop dependencies (GTK3 + WebKit2GTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.0-dev
          pkg-config --exists gtk+-3.0 && pkg-config --exists webkit2gtk-4.0

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Build portable tarball
        env:
          SKIP_FRONTEND: '1'
        run: ./packaging/linux/build_linux_package.sh "${{ steps.ver.outputs.version }}" dist-linux

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: dist-linux/SamOffice-linux-x64-${{ steps.ver.outputs.version }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [windows, macos, linux]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            v="${{ github.event.inputs.version }}"
          else
            v="${{ github.ref_name }}"
          fi
          v="${v#v}"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List assets
        run: ls -lh dist

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          tag="v$V"
          title="SamOffice v$V"
          notes="$(
            printf '%s\n' \
              "## SamOffice v$V 桌面版（Windows / macOS / Linux）" \
              "" \
              "| 平台 | 文件 | 说明 |" \
              "|------|------|------|" \
              "| Windows | \`SamOffice-setup-$V.exe\` | 双击安装（安装界面支持 English / 简体中文，无需管理员权限）|" \
              "| Windows | \`SamOffice-desktop-windows-x64-$V.zip\` | 便携版，解压即用 |" \
              "| macOS (Apple Silicon) | \`SamOffice-macos-arm64-$V.zip\` / \`.dmg\` | \`.app\` 拖入 /Applications |" \
              "| macOS (Intel) | \`SamOffice-macos-x64-$V.zip\` / \`.dmg\` | \`.app\` 拖入 /Applications |" \
              "| Linux (x64) | \`SamOffice-linux-x64-$V.tar.gz\` | 便携包（二进制 + .desktop + 图标）|" \
              "" \
              "### 一行安装" \
              "" \
              "\`\`\`bash" \
              "# macOS（自动识别 Apple Silicon / Intel，安装到 /Applications）" \
              "curl -fsSL https://raw.githubusercontent.com/samaidev/samoffice/main/scripts/install-macos.sh | bash" \
              "" \
              "# Linux x64（安装到 ~/.local，无需 root）" \
              "curl -fsSL https://raw.githubusercontent.com/samaidev/samoffice/main/scripts/install-linux.sh | bash" \
              "\`\`\`" \
              "" \
              "macOS 包为 ad-hoc 签名（未公证）：安装脚本会自动去掉隔离标记；手动安装时首次请右键 → 打开。" \
              "" \
              "由 GitHub Actions 自动构建发布。"
          )"
          # 已存在同 tag release 则删除重建（workflow_dispatch 重复发布场景）
          if gh release view "$tag" --json id >/dev/null 2>&1; then
            gh release delete "$tag" --yes --cleanup-tag
          fi
          gh release create "$tag" --title "$title" --notes "$notes" --target "${{ github.sha }}"
          gh release upload "$tag" dist/* --clobber
          gh release view "$tag"

      - name: Prune old releases (keep latest 3)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release list --limit 100 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[3:] | .[].tagName' \
          | while read -r t; do
              [ -n "$t" ] || continue
              echo "delete $t"
              gh release delete "$t" --yes --cleanup-tag
            done

  # ---------------------------------------------------------------------------
  # Mirror release artifacts to ModelScope + HuggingFace and update the unified
  # catalog (samaidev/samai-releases). Tag pushes only, after the Release job.
  # ---------------------------------------------------------------------------
  mirror-catalog:
    name: Mirror (MS/HF) + update catalog
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [release]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install upload SDKs
        run: pip install huggingface_hub modelscope

      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --dir assets --repo "$GITHUB_REPOSITORY"
          ls -lh assets

      - name: Fetch current catalog (single source of truth)
        run: |
          curl -fsSL -o catalog.json \
            https://raw.githubusercontent.com/samaidev/samai-releases/main/catalog.json

      - name: Mirror to MS/HF + update catalog
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          MS_TOKEN: ${{ secrets.MS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          python ci/publish_channels.py \
            --dist assets --product samoffice --version "$GITHUB_REF_NAME" \
            --repo samaidev/samoffice --catalog catalog.json \
            --glob "samoffice"
