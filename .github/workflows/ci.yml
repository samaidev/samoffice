name: CI

# 推送 / PR 时做编译与前端类型检查，保证主干可构建
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build (windows-amd64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: go.sum

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        shell: pwsh
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Build desktop exe
        shell: pwsh
        env:
          CGO_ENABLED: '0'
          GOOS: windows
          GOARCH: amd64
        run: go build -tags desktop,production -trimpath -ldflags "-s -w -H windowsgui" -o samoffice.exe .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: samoffice-windows-x64
          path: samoffice.exe
          retention-days: 7
