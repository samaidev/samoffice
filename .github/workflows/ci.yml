name: CI

# 推送 / PR 时在 Windows / macOS / Linux 三平台编译，保证三端主干都可构建：
#   windows-amd64  samoffice.exe（+ windowsgui 链接参数）
#   macos-arm64    SamOffice.app（Apple Silicon）
#   macos-amd64    SamOffice.app（Intel）
#   linux-amd64    samoffice（GTK3 + WebKit2GTK 桌面版）
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-amd64
            os: windows-latest
            goos: windows
            goarch: amd64
            ldflags: -s -w -H windowsgui
            output: samoffice.exe
            artifact: samoffice-windows-x64
          # macos-14 已于 2026-11-02 退役；x64 只能用 macos-15-intel（Intel）
          - name: macos-arm64
            os: macos-15
            goos: darwin
            goarch: arm64
            arch: arm64
            artifact: samoffice-macos-arm64
          - name: macos-amd64
            os: macos-15-intel
            goos: darwin
            goarch: amd64
            arch: x64
            artifact: samoffice-macos-x64
          - name: linux-amd64
            os: ubuntu-22.04
            goos: linux
            goarch: amd64
            ldflags: -s -w
            output: samoffice
            artifact: samoffice-linux-x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: go.sum

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux desktop dependencies (GTK3 + WebKit2GTK)
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.0-dev
          pkg-config --exists gtk+-3.0 && pkg-config --exists webkit2gtk-4.0

      - name: Download Go modules
        run: go mod download

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Build desktop binary
        if: matrix.goos != 'darwin'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          # Windows 走 go-webview2，无需 cgo；macOS/Linux 的 Wails 运行时依赖 cgo
          CGO_ENABLED: ${{ matrix.goos == 'windows' && '0' || '1' }}
        run: go build -tags desktop,production -trimpath -ldflags "${{ matrix.ldflags }}" -o ${{ matrix.output }} .

      # macOS 侧直接用打包脚本验证 .app 结构（图标 / Info.plist / ad-hoc 签名），
      # 与发布流程走同一条路径，避免 CI 绿的代码打不出可用窗口版。
      - name: Package macOS .app
        if: matrix.goos == 'darwin'
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          SKIP_FRONTEND: '1'
        run: |
          set -o pipefail
          ./packaging/macos/build_macos_app.sh "0.0.0-ci" dist-macos 2>&1 | tee macos-package.log

      # 打包步骤失败时把日志尾部/错误行转成注解（GitHub 每个 step 最多收 10 条）：
      # 没有 Actions 日志权限的人也能在 check-run 里看到原因
      - name: Surface packaging log tail
        if: failure() && matrix.goos == 'darwin'
        shell: bash
        run: |
          tail -n 10 macos-package.log | while IFS= read -r line; do
            echo "::error title=macOS packaging tail::${line}"
          done

      - name: Surface packaging errors
        if: failure() && matrix.goos == 'darwin'
        shell: bash
        run: |
          grep -Ei "error|cannot|denied|no space|undefined|fatal|exit status" macos-package.log | tail -n 10 | while IFS= read -r line; do
            echo "::error title=macOS packaging error::${line}"
          done

      - name: Sanity check macOS bundle
        if: matrix.goos == 'darwin' && success()
        run: |
          test -x dist-macos/SamOffice.app/Contents/MacOS/samoffice
          test -f dist-macos/SamOffice.app/Contents/Resources/AppIcon.icns
          test -f dist-macos/SamOffice.app/Contents/Info.plist
          plutil -lint dist-macos/SamOffice.app/Contents/Info.plist
          codesign --verify --deep dist-macos/SamOffice.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.goos == 'darwin' && 'dist-macos/*.zip' || matrix.output }}
          if-no-files-found: error
          retention-days: 7
